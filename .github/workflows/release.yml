name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install and sync Capacitor
        run: |
          npm ci
          npm test
          npx cap sync android

      - name: Decode Keystore
        run: |
          test -n "${{ secrets.KEYSTORE_BASE64 }}" || { echo "KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Unit tests and release APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Rename APK
        # same name in every release, so the app's update check and releases/latest/download/Monatskasse.apk always work
        run: mv android/app/build/outputs/apk/release/app-release.apk Monatskasse.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Monatskasse ${{ github.ref_name }}
          body: |
            `Monatskasse.apk` unten herunterladen und installieren. Ab 1.2.0 sucht die App beim Start
            selbst nach neuen Versionen und installiert sie mit einem Tipp.

            Android 6.0 oder neuer. Was neu ist, steht im README.
          files: Monatskasse.apk
